<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bloodline Brawl</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="game">

  <!-- =====================================================
       TITLE SCREEN
  ====================================================== -->

  <section id="titleScreen" class="screen title-screen active">

    <div class="title-bg-lines"></div>

    <div class="title-content">

      <div class="studio-name">
        McD GAMES
      </div>

      <div class="presents">
        PRESENTS
      </div>

      <h1 class="game-logo">
        BLOODLINE
        <span>BRAWL</span>
      </h1>

      <div class="tagline">
        FAMILY FIGHTS GET PERSONAL
      </div>

      <div class="title-versus-panel">

        <div class="title-fighter">

          <div
            id="titleLeftCharacter"
            class="title-character-space"
          ></div>

          <div
            id="titleLeftName"
            class="title-name"
          ></div>

        </div>

        <div class="title-vs">

          <span class="vs-main">
            VS
          </span>

        </div>

        <div class="title-fighter">

          <div
            id="titleRightCharacter"
            class="title-character-space"
          ></div>

          <div
            id="titleRightName"
            class="title-name"
          ></div>

        </div>

      </div>

      <button
        id="startButton"
        class="big-button title-start-button"
      >
        START
      </button>

    </div>

  </section>



  <!-- =====================================================
       CHARACTER SELECT
  ====================================================== -->

  <section
    id="selectScreen"
    class="screen select-screen"
  >

    <div class="screen-kicker">
      STEP 1
    </div>

    <div class="screen-heading">
      SELECT YOUR FIGHTER
    </div>

    <div class="fighter-select">

      <button
        class="fighter-card selected"
        data-character="brendan"
      >

        <div
          class="card-model-holder"
          data-preview="brendan"
        ></div>

        <strong>
          BRENDAN
        </strong>

        <small>
          Golf Club • Big Drive • IPO
        </small>

      </button>


      <button
        class="fighter-card"
        data-character="grandaddy"
      >

        <div
          class="card-model-holder"
          data-preview="grandaddy"
        ></div>

        <strong>
          GRANDADDY
        </strong>

        <small>
          Hammer • Ladder • Back In My Day
        </small>

      </button>


      <button
        class="fighter-card"
        data-character="connor"
      >

        <div
          class="card-model-holder"
          data-preview="connor"
        ></div>

        <strong>
          CONNOR
        </strong>

        <small>
          Paintbrush • Paint Beast • Fried Chicken Feast
        </small>

      </button>


      <button
        class="fighter-card"
        data-character="erin"
      >

        <div
          class="card-model-holder"
          data-preview="erin"
        ></div>

        <strong>
          ERIN
        </strong>

        <small>
          Hairbrush • Pimple Patch • Laundry Avalanche
        </small>

      </button>

    </div>

    <div id="selectionText">
      PLAYER: BRENDAN
    </div>

    <button
      id="mapSelectButton"
      class="big-button"
    >
      CHOOSE MAP
    </button>

  </section>



  <!-- =====================================================
       MAP SELECT
  ====================================================== -->

  <section
    id="mapScreen"
    class="screen map-screen"
  >

    <div class="screen-kicker">
      STEP 2
    </div>

    <div class="screen-heading">
      SELECT BATTLEFIELD
    </div>

    <div class="map-grid">


      <!-- VIRGINIA -->

      <button
        class="map-card selected"
        data-map="virginia"
      >

        <div class="map-preview virginia-preview">

          <div class="preview-sun"></div>

          <div class="virginia-estate-preview">

            <div class="estate-preview-door"></div>

            <div class="estate-preview-window ew1"></div>
            <div class="estate-preview-window ew2"></div>
            <div class="estate-preview-window ew3"></div>
            <div class="estate-preview-window ew4"></div>

          </div>

          <div class="virginia-preview-hedge"></div>

          <div class="preview-tree tree-one"></div>
          <div class="preview-tree tree-two"></div>

        </div>

        <strong>
          SUBURBAN VIRGINIA
        </strong>

        <small>
          Big lawns. Bigger houses. Family business on the front lawn.
        </small>

      </button>



      <!-- WESTHAMPTON -->

      <button
        class="map-card"
        data-map="westhampton"
      >

        <div class="map-preview westhampton-preview">

          <div class="preview-sun beach-sun"></div>

          <div class="preview-ocean"></div>

          <div class="preview-umbrella"></div>

          <div class="preview-icecream">
            ICE CREAM
          </div>

        </div>

        <strong>
          WESTHAMPTON BEACH
        </strong>

        <small>
          Sun, sand, ice cream, and absolutely nowhere to run.
        </small>

      </button>



      <!-- NEW CANAAN -->

      <button
        class="map-card"
        data-map="newcanaan"
      >

        <div class="map-preview newcanaan-preview">

          <div class="nc-preview-building nc-red">
            MARKET
          </div>

          <div class="nc-preview-building nc-white">
            CAFE
          </div>

          <div class="nc-preview-building nc-brick">
            SHOPS
          </div>

          <div class="preview-lamp"></div>

        </div>

        <strong>
          NEW CANAAN
        </strong>

        <small>
          Small-town charm. Big-time problems.
        </small>

      </button>



      <!-- MADRID -->

      <button
        class="map-card"
        data-map="madrid"
      >

        <div class="map-preview madrid-preview">

          <div class="madrid-preview-left"></div>

          <div class="madrid-preview-right"></div>

          <div class="madrid-preview-balcony balcony-one"></div>

          <div class="madrid-preview-balcony balcony-two"></div>

          <div class="preview-fountain"></div>

        </div>

        <strong>
          MADRID
        </strong>

        <small>
          A sunlit Spanish plaza built for a family showdown.
        </small>

      </button>

    </div>

    <div id="mapSelectionText">
      MAP: SUBURBAN VIRGINIA
    </div>

    <div class="map-screen-buttons">

      <button
        id="backToFighterButton"
        class="secondary-button"
      >
        BACK
      </button>

      <button
        id="fightButton"
        class="big-button"
      >
        FIGHT
      </button>

    </div>

  </section>



  <!-- =====================================================
       FIGHT SCREEN
  ====================================================== -->

  <section
    id="fightScreen"
    class="screen fight-screen"
  >

    <div class="hud">

      <div class="hud-side">

        <div
          id="playerName"
          class="hud-name"
        ></div>

        <div
          id="playerHealthShell"
          class="health-bar"
        >

          <div
            id="playerDamageTrail"
            class="damage-trail"
          ></div>

          <div
            id="playerHealth"
            class="health-fill"
          ></div>

        </div>

        <div class="ultimate-bar">
          <div id="playerUltimate"></div>
        </div>

      </div>


      <div class="center-hud">

        <div
          id="roundScore"
          class="round-score"
        >
          0 - 0
        </div>

        <div
          id="roundLabel"
          class="round-label"
        >
          ROUND 1
        </div>

        <div
          id="roundText"
          class="round-text"
        ></div>

      </div>


      <div class="hud-side right">

        <div
          id="cpuName"
          class="hud-name"
        ></div>

        <div
          id="cpuHealthShell"
          class="health-bar"
        >

          <div
            id="cpuDamageTrail"
            class="damage-trail"
          ></div>

          <div
            id="cpuHealth"
            class="health-fill"
          ></div>

        </div>

        <div class="ultimate-bar">
          <div id="cpuUltimate"></div>
        </div>

      </div>

    </div>


    <div
      id="arena"
      class="arena map-virginia"
    >

      <div class="map-decor">

        <div class="map-extra decor-one"></div>
        <div class="map-extra decor-two"></div>
        <div class="map-extra decor-three"></div>
        <div class="map-extra decor-four"></div>

      </div>

      <div id="effects"></div>


      <div
        id="battleIntro"
        class="battle-intro hidden"
      >

        <div
          id="battleMapName"
          class="battle-map-name"
        ></div>

        <div
          id="battleIntroRound"
          class="battle-intro-round"
        >
          ROUND 1
        </div>

        <div
          id="battleIntroWord"
          class="battle-intro-word"
        >
          READY...
        </div>

      </div>


      <div
        id="playerFighter"
        class="fight-character"
      >

        <div class="motion-layer">

          <div class="visual-layer">

            <div class="fighter-model-slot"></div>

          </div>

        </div>

      </div>


      <div
        id="cpuFighter"
        class="fight-character cpu-facing"
      >

        <div class="motion-layer">

          <div class="visual-layer">

            <div class="fighter-model-slot"></div>

          </div>

        </div>

      </div>


      <div class="arena-abilities player-abilities">

        <div
          id="playerSpecialOrb"
          class="ability-orb special-orb"
        >

          <div
            id="playerSpecialIcon"
            class="ability-icon"
          ></div>

        </div>

        <div
          id="playerUltimateOrb"
          class="ability-orb ultimate-orb"
        >

          <div
            id="playerUltimateIcon"
            class="ability-icon"
          ></div>

        </div>

      </div>


      <div class="arena-abilities cpu-abilities">

        <div
          id="cpuSpecialOrb"
          class="ability-orb special-orb"
        >

          <div
            id="cpuSpecialIcon"
            class="ability-icon"
          ></div>

        </div>

        <div
          id="cpuUltimateOrb"
          class="ability-orb ultimate-orb"
        >

          <div
            id="cpuUltimateIcon"
            class="ability-icon"
          ></div>

        </div>

      </div>


      <div
        id="koOverlay"
        class="ko-overlay hidden"
      >

        <div class="ko-text">
          K.O.
        </div>

        <div
          id="winnerText"
          class="winner-text"
        ></div>

        <div
          id="matchStatus"
          class="match-status"
        ></div>

        <button
          id="newGameButton"
          class="new-game-button hidden"
        >
          NEW GAME
        </button>

      </div>

    </div>


    <div class="control-panel">

      <div class="keyboard-guide">

        <span>
          A / D or ← / →
          <b>MOVE</b>
        </span>

        <span>
          W / ↑ / SPACE
          <b>JUMP</b>
        </span>

        <span>
          S / ↓
          <b>DUCK</b>
        </span>

      </div>

      <div class="action-buttons">

        <button
          id="blockButton"
          class="action-button block-button"
        >
          BLOCK
          <small>I</small>
        </button>

        <button
          id="attackButton"
          class="action-button attack-button"
        >
          ATTACK
          <small>J</small>
        </button>

        <button
          id="specialButton"
          class="action-button special-button"
        >
          SPECIAL
          <small>K</small>
        </button>

        <button
          id="ultimateButton"
          class="action-button ultimate-button"
        >
          ULTIMATE
          <small>L</small>
        </button>

      </div>

    </div>

  </section>

</div>

<script src="script.js"></script>

</body>
</html>
