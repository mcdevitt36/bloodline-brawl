<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Bloodline Brawl</title>

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>


<body>

<div id="game">


  <!-- =====================================================
       TITLE SCREEN
  ====================================================== -->

  <section
    id="titleScreen"
    class="screen title-screen active"
  >

    <div class="title-bg-lines"></div>


    <div class="title-content">

      <div class="studio-name">
        McD GAMES
      </div>


      <div class="presents">
        PRESENTS
      </div>


      <h1 class="game-logo">

        BLOODLINE

        <span>
          BRAWL
        </span>

      </h1>


      <div class="tagline">
        FAMILY FIGHTS GET PERSONAL
      </div>


      <div class="title-versus-panel">


        <!-- BRENDAN -->

        <div class="title-fighter">

          <div class="title-character-space">

            <div class="pixel-person brendan-model">

              <div class="brendan-hair"></div>


              <div class="face">

                <div class="eye eye-left"></div>

                <div class="eye eye-right"></div>

                <div class="mouth"></div>

              </div>


              <div class="brendan-shirt">

                <div class="polo-collar collar-left"></div>

                <div class="polo-collar collar-right"></div>

                <div class="whale-mark"></div>

              </div>


              <div class="skin arm left-arm"></div>


              <div class="skin arm right-arm weapon-arm">

                <div class="golf-club"></div>

              </div>


              <div class="khaki leg left-leg"></div>

              <div class="khaki leg right-leg"></div>


              <div class="white-shoe left-shoe"></div>

              <div class="white-shoe right-shoe"></div>

            </div>

          </div>


          <div class="title-name">
            BRENDAN
          </div>

        </div>


        <!-- CENTER VS -->

        <div class="title-vs">

          <span class="vs-main">
            VS
          </span>

        </div>


        <!-- GRANDADDY -->

        <div class="title-fighter">

          <div class="title-character-space">

            <div class="pixel-person grandaddy-model">

              <div class="grandaddy-hair"></div>


              <div class="face grandaddy-face">

                <div class="eye eye-left"></div>

                <div class="eye eye-right"></div>

                <div class="mouth"></div>

              </div>


              <div class="glasses glasses-left"></div>

              <div class="glasses glasses-right"></div>

              <div class="glasses-bridge"></div>


              <div class="orange-hat"></div>

              <div class="orange-brim"></div>


              <div class="hat-letter">
                S
              </div>


              <div class="grandaddy-shirt"></div>


              <div class="skin arm left-arm"></div>


              <div class="skin arm right-arm weapon-arm">

                <div class="hammer"></div>

              </div>


              <div class="black-pants leg left-leg"></div>

              <div class="black-pants leg right-leg"></div>


              <div class="white-shoe left-shoe"></div>

              <div class="white-shoe right-shoe"></div>

            </div>

          </div>


          <div class="title-name">
            GRANDADDY
          </div>

        </div>

      </div>


      <button
        id="startButton"
        class="big-button title-start-button"
      >
        START
      </button>

    </div>

  </section>



  <!-- =====================================================
       CHARACTER SELECT
  ====================================================== -->

  <section
    id="selectScreen"
    class="screen select-screen"
  >

    <div class="screen-kicker">
      STEP 1
    </div>


    <div class="screen-heading">
      SELECT YOUR FIGHTER
    </div>


    <div class="fighter-select">


      <!-- BRENDAN -->

      <button
        class="fighter-card selected"
        data-character="brendan"
      >

        <div class="pixel-person brendan-model card-model">

          <div class="brendan-hair"></div>


          <div class="face">

            <div class="eye eye-left"></div>

            <div class="eye eye-right"></div>

            <div class="mouth"></div>

          </div>


          <div class="brendan-shirt">

            <div class="polo-collar collar-left"></div>

            <div class="polo-collar collar-right"></div>

            <div class="whale-mark"></div>

          </div>


          <div class="skin arm left-arm"></div>


          <div class="skin arm right-arm weapon-arm">

            <div class="golf-club"></div>

          </div>


          <div class="khaki leg left-leg"></div>

          <div class="khaki leg right-leg"></div>


          <div class="white-shoe left-shoe"></div>

          <div class="white-shoe right-shoe"></div>

        </div>


        <strong>
          BRENDAN
        </strong>


        <small>
          Golf Club • Big Drive • IPO
        </small>

      </button>


      <!-- GRANDADDY -->

      <button
        class="fighter-card"
        data-character="grandaddy"
      >

        <div class="pixel-person grandaddy-model card-model">

          <div class="grandaddy-hair"></div>


          <div class="face grandaddy-face">

            <div class="eye eye-left"></div>

            <div class="eye eye-right"></div>

            <div class="mouth"></div>

          </div>


          <div class="glasses glasses-left"></div>

          <div class="glasses glasses-right"></div>

          <div class="glasses-bridge"></div>


          <div class="orange-hat"></div>

          <div class="orange-brim"></div>


          <div class="hat-letter">
            S
          </div>


          <div class="grandaddy-shirt"></div>


          <div class="skin arm left-arm"></div>


          <div class="skin arm right-arm weapon-arm">

            <div class="hammer"></div>

          </div>


          <div class="black-pants leg left-leg"></div>

          <div class="black-pants leg right-leg"></div>


          <div class="white-shoe left-shoe"></div>

          <div class="white-shoe right-shoe"></div>

        </div>


        <strong>
          GRANDADDY
        </strong>


        <small>
          Hammer • Ladder • Back In My Day
        </small>

      </button>

    </div>


    <div id="selectionText">
      PLAYER: BRENDAN
    </div>


    <button
      id="mapSelectButton"
      class="big-button"
    >
      CHOOSE MAP
    </button>

  </section>



  <!-- =====================================================
       MAP SELECT
  ====================================================== -->

  <section
    id="mapScreen"
    class="screen map-screen"
  >

    <div class="screen-kicker">
      STEP 2
    </div>


    <div class="screen-heading">
      SELECT BATTLEFIELD
    </div>


    <div class="map-grid">


      <!-- VIRGINIA -->

      <button
        class="map-card selected"
        data-map="virginia"
      >

        <div class="map-preview virginia-preview">

          <div class="preview-sun"></div>

          <div class="preview-house house-one"></div>

          <div class="preview-house house-two"></div>

          <div class="preview-tree tree-one"></div>

          <div class="preview-tree tree-two"></div>

        </div>


        <strong>
          SUBURBAN VIRGINIA
        </strong>


        <small>
          Quiet streets. Big yards. Settle it in the suburbs.
        </small>

      </button>



      <!-- WESTHAMPTON -->

      <button
        class="map-card"
        data-map="westhampton"
      >

        <div class="map-preview westhampton-preview">

          <div class="preview-sun beach-sun"></div>

          <div class="preview-ocean"></div>

          <div class="preview-umbrella"></div>

        </div>


        <strong>
          WESTHAMPTON BEACH
        </strong>


        <small>
          Sun, sand, and absolutely nowhere to run.
        </small>

      </button>



      <!-- NEW CANAAN -->

      <button
        class="map-card"
        data-map="newcanaan"
      >

        <div class="map-preview newcanaan-preview">

          <div class="preview-shop shop-one">
            CAFE
          </div>

          <div class="preview-shop shop-two">
            MARKET
          </div>

          <div class="preview-lamp"></div>

        </div>


        <strong>
          NEW CANAAN
        </strong>


        <small>
          Small-town charm. Big-time problems.
        </small>

      </button>



      <!-- MADRID -->

      <button
        class="map-card"
        data-map="madrid"
      >

        <div class="map-preview madrid-preview">

          <div class="preview-building madrid-building-left"></div>

          <div class="preview-building madrid-building-right"></div>

          <div class="preview-fountain"></div>

        </div>


        <strong>
          MADRID
        </strong>


        <small>
          The city is alive. Only one fighter walks away.
        </small>

      </button>

    </div>


    <div id="mapSelectionText">
      MAP: SUBURBAN VIRGINIA
    </div>


    <div class="map-screen-buttons">

      <button
        id="backToFighterButton"
        class="secondary-button"
      >
        BACK
      </button>


      <button
        id="fightButton"
        class="big-button"
      >
        FIGHT
      </button>

    </div>

  </section>



  <!-- =====================================================
       FIGHT
  ====================================================== -->

  <section
    id="fightScreen"
    class="screen fight-screen"
  >


    <!-- HUD -->

    <div class="hud">


      <div class="hud-side">

        <div
          id="playerName"
          class="hud-name"
        ></div>


        <div
          id="playerHealthShell"
          class="health-bar"
        >

          <div
            id="playerDamageTrail"
            class="damage-trail"
          ></div>

          <div
            id="playerHealth"
            class="health-fill"
          ></div>

        </div>


        <div class="ultimate-bar">

          <div id="playerUltimate"></div>

        </div>

      </div>



      <div class="center-hud">

        <div
          id="roundScore"
          class="round-score"
        >
          0 - 0
        </div>


        <div
          id="roundLabel"
          class="round-label"
        >
          ROUND 1
        </div>


        <div
          id="roundText"
          class="round-text"
        ></div>

      </div>



      <div class="hud-side right">

        <div
          id="cpuName"
          class="hud-name"
        ></div>


        <div
          id="cpuHealthShell"
          class="health-bar"
        >

          <div
            id="cpuDamageTrail"
            class="damage-trail"
          ></div>

          <div
            id="cpuHealth"
            class="health-fill"
          ></div>

        </div>


        <div class="ultimate-bar">

          <div id="cpuUltimate"></div>

        </div>

      </div>

    </div>



    <!-- ARENA -->

    <div
      id="arena"
      class="arena map-virginia"
    >

      <div
        id="mapDecor"
        class="map-decor"
      ></div>


      <div id="effects"></div>



      <!-- INTRO -->

      <div
        id="battleIntro"
        class="battle-intro hidden"
      >

        <div
          id="battleMapName"
          class="battle-map-name"
        >
          SUBURBAN VIRGINIA
        </div>


        <div
          id="battleIntroRound"
          class="battle-intro-round"
        >
          ROUND 1
        </div>


        <div
          id="battleIntroWord"
          class="battle-intro-word"
        >
          READY...
        </div>

      </div>



      <!-- PLAYER -->

      <div
        id="playerFighter"
        class="fight-character"
      >

        <div class="motion-layer">

          <div class="visual-layer">

            <div class="fighter-model-slot"></div>

          </div>

        </div>

      </div>



      <!-- CPU -->

      <div
        id="cpuFighter"
        class="fight-character cpu-facing"
      >

        <div class="motion-layer">

          <div class="visual-layer">

            <div class="fighter-model-slot"></div>

          </div>

        </div>

      </div>



      <!-- PLAYER ABILITY ORBS -->

      <div class="arena-abilities player-abilities">

        <div
          id="playerSpecialOrb"
          class="ability-orb special-orb"
        >

          <div
            id="playerSpecialIcon"
            class="ability-icon"
          >
            ⛳
          </div>

        </div>


        <div
          id="playerUltimateOrb"
          class="ability-orb ultimate-orb"
        >

          <div
            id="playerUltimateIcon"
            class="ability-icon"
          >
            📈
          </div>

        </div>

      </div>



      <!-- CPU ABILITY ORBS -->

      <div class="arena-abilities cpu-abilities">

        <div
          id="cpuSpecialOrb"
          class="ability-orb special-orb"
        >

          <div
            id="cpuSpecialIcon"
            class="ability-icon"
          >
            🪜
          </div>

        </div>


        <div
          id="cpuUltimateOrb"
          class="ability-orb ultimate-orb"
        >

          <div
            id="cpuUltimateIcon"
            class="ability-icon"
          >
            💬
          </div>

        </div>

      </div>



      <!-- KO -->

      <div
        id="koOverlay"
        class="ko-overlay hidden"
      >

        <div class="ko-text">
          K.O.
        </div>


        <div
          id="winnerText"
          class="winner-text"
        ></div>


        <div
          id="matchStatus"
          class="match-status"
        ></div>


        <button
          id="newGameButton"
          class="new-game-button hidden"
        >
          NEW GAME
        </button>

      </div>

    </div>



    <!-- CONTROLS -->

    <div class="control-panel">

      <div class="keyboard-guide">

        <span>
          A / D or ← / →
          <b>MOVE</b>
        </span>


        <span>
          W / ↑ / SPACE
          <b>JUMP</b>
        </span>


        <span>
          S / ↓
          <b>DUCK</b>
        </span>

      </div>


      <div class="action-buttons">

        <button
          id="blockButton"
          class="action-button block-button"
        >
          BLOCK
          <small>I</small>
        </button>


        <button
          id="attackButton"
          class="action-button attack-button"
        >
          ATTACK
          <small>J</small>
        </button>


        <button
          id="specialButton"
          class="action-button special-button"
        >
          SPECIAL
          <small>K</small>
        </button>


        <button
          id="ultimateButton"
          class="action-button ultimate-button"
        >
          ULTIMATE
          <small>L</small>
        </button>

      </div>

    </div>

  </section>

</div>


<script src="script.js"></script>

</body>

</html>
